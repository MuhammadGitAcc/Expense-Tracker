name: expense-tracker

services:
  postgres:
    image: postgres:18-alpine
    container_name: expense_tracker_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: expense_user
      POSTGRES_PASSWORD: dev_password_change_me
      POSTGRES_DB: expense_tracker
    ports:
      # host:container. 5433 avoids a clash with the local PostgreSQL on 5432
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expense_user -d expense_tracker"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: expense_tracker_api
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: development
      PORT: "5000"
      DATABASE_URL: postgresql://expense_user:dev_password_change_me@postgres:5432/expense_tracker
      CORS_ORIGIN: http://localhost:8080
      FRONTEND_URL: http://localhost:8080
      COOKIE_SECURE: "false"
      UPLOAD_DIR: uploads
      LOG_LEVEL: info
    command:
      [
        "sh",
        "-c",
        "node database/migrate.js && node database/seed.js && node src/server.js",
      ]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
    container_name: expense_tracker_web
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

  # Optional database UI. Start it with:  docker compose --profile tools up -d
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: expense_tracker_pgadmin
    restart: unless-stopped
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin_dev_password
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  pgadmin_data:
  backend_uploads:
