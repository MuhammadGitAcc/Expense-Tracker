<!doctype html>
<html lang="en">
  <body
    style="
      margin: 0;
      padding: 24px;
      background: #f3f4f6;
      font-family: Arial, Helvetica, sans-serif;
      color: #111827;
    "
  >
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="480"
            cellpadding="0"
            cellspacing="0"
            style="max-width: 480px; background: #ffffff; border-radius: 8px; padding: 32px"
          >
            <tr>
              <td>
                <h1 style="margin: 0 0 16px; font-size: 22px">Confirm your email</h1>
                <p style="margin: 0 0 16px; line-height: 1.5">Hi {{name}},</p>
                <p style="margin: 0 0 24px; line-height: 1.5">
                  Use this code to finish creating your {{appName}} account:
                </p>
                <p
                  style="
                    margin: 0 0 24px;
                    padding: 16px;
                    background: #eef2ff;
                    border-radius: 6px;
                    text-align: center;
                    font-size: 32px;
                    font-weight: bold;
                    letter-spacing: 8px;
                    color: #4f46e5;
                  "
                >
                  {{code}}
                </p>
                <p style="margin: 0 0 8px; line-height: 1.5">
                  The code is valid for {{expiresInMinutes}} minutes and can be used once.
                </p>
                <p style="margin: 0; line-height: 1.5; color: #6b7280; font-size: 13px">
                  If you did not create an account, you can ignore this email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
