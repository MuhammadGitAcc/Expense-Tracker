<!doctype html>
<html lang="en">
  <body
    style="
      margin: 0;
      padding: 24px;
      background: #f3f4f6;
      font-family: Arial, Helvetica, sans-serif;
      color: #111827;
    "
  >
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="480"
            cellpadding="0"
            cellspacing="0"
            style="max-width: 480px; background: #ffffff; border-radius: 8px; padding: 32px"
          >
            <tr>
              <td>
                <h1 style="margin: 0 0 16px; font-size: 22px">Reset your password</h1>
                <p style="margin: 0 0 16px; line-height: 1.5">Hi {{name}},</p>
                <p style="margin: 0 0 24px; line-height: 1.5">
                  We received a request to reset your {{appName}} password. This link works once and
                  expires in {{expiresInMinutes}} minutes.
                </p>
                <a
                  href="{{resetUrl}}"
                  style="
                    display: inline-block;
                    background: #4f46e5;
                    color: #ffffff;
                    text-decoration: none;
                    padding: 12px 24px;
                    border-radius: 6px;
                  "
                  >Choose a new password</a
                >
                <p style="margin: 24px 0 0; font-size: 13px; line-height: 1.5; color: #6b7280">
                  If you did not ask for this, you can ignore this email. Your password will not
                  change.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
