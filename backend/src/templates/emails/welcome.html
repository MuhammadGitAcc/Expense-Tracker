<!doctype html>
<html lang="en">
  <body
    style="
      margin: 0;
      padding: 24px;
      background: #f3f4f6;
      font-family: Arial, Helvetica, sans-serif;
      color: #111827;
    "
  >
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="480"
            cellpadding="0"
            cellspacing="0"
            style="max-width: 480px; background: #ffffff; border-radius: 8px; padding: 32px"
          >
            <tr>
              <td>
                <h1 style="margin: 0 0 16px; font-size: 22px">Welcome to {{appName}}</h1>
                <p style="margin: 0 0 16px; line-height: 1.5">Hi {{name}},</p>
                <p style="margin: 0 0 24px; line-height: 1.5">
                  Your account is ready. You can now track your expenses, income and budgets in one
                  place.
                </p>
                <a
                  href="{{appUrl}}"
                  style="
                    display: inline-block;
                    background: #4f46e5;
                    color: #ffffff;
                    text-decoration: none;
                    padding: 12px 24px;
                    border-radius: 6px;
                  "
                  >Open {{appName}}</a
                >
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
