<!doctype html>
<html lang="en">
  <body
    style="
      margin: 0;
      padding: 24px;
      background: #f3f4f6;
      font-family: Arial, Helvetica, sans-serif;
      color: #111827;
    "
  >
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="480"
            cellpadding="0"
            cellspacing="0"
            style="max-width: 480px; background: #ffffff; border-radius: 8px; padding: 32px"
          >
            <tr>
              <td>
                <h1 style="margin: 0 0 8px; font-size: 22px">Your week in review</h1>
                <p style="margin: 0 0 16px; color: #6b7280">{{weekLabel}}</p>
                <p style="margin: 0 0 16px; line-height: 1.5">Hi {{name}},</p>
                <table
                  role="presentation"
                  width="100%"
                  cellpadding="8"
                  cellspacing="0"
                  style="margin: 0 0 16px; background: #eef2ff; border-radius: 6px"
                >
                  <tr>
                    <td>Income</td>
                    <td align="right"><strong>{{income}} {{currency}}</strong></td>
                  </tr>
                  <tr>
                    <td>Expenses</td>
                    <td align="right"><strong>{{expense}} {{currency}}</strong></td>
                  </tr>
                  <tr>
                    <td>Net</td>
                    <td align="right"><strong>{{net}} {{currency}}</strong></td>
                  </tr>
                </table>
                <p style="margin: 0 0 8px; line-height: 1.5">{{topCategories}}</p>
                <p style="margin: 0 0 24px; line-height: 1.5">{{changeText}}</p>
                <a
                  href="{{appUrl}}"
                  style="
                    display: inline-block;
                    background: #4f46e5;
                    color: #ffffff;
                    text-decoration: none;
                    padding: 12px 24px;
                    border-radius: 6px;
                  "
                  >Open {{appName}}</a
                >
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
